# `cargo deny check licenses bans sources`, in CI's `deny` job. Advisories
# are `audit.yml`, which files an issue; this is the policy the tree must
# satisfy on every push.

# Every frontend, so a dependency only one of them pulls in is still checked.
[graph]
all-features = true

# No copyleft enters the tree. vibeboy is 0BSD, and a build of any frontend
# should carry nothing a user did not choose. Every dependency today is on
# this list; a new one under another license fails here.
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "IJG",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
unused-allowed-license = "deny"

[bans]
# The GUI, GPU and camera stacks each bring their own windows-sys, bitflags
# and friends, so duplicates are normal here. Worth seeing, not failing on.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
