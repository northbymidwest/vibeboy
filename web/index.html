<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VibeBoy</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  h1 { margin-bottom: 12px; font-size: 1.4em; color: #8be9fd; }
  #drop-zone {
    border: 2px dashed #555;
    border-radius: 8px;
    padding: 40px;
    text-align: center;
    cursor: pointer;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  #drop-zone.hover { border-color: #8be9fd; }
  #drop-zone.hidden { display: none; }
  #canvas-wrapper {
    resize: both;
    overflow: hidden;
    border: 2px solid #333;
    border-radius: 4px;
    width: 640px;
    height: 576px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  #canvas-wrapper canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  #status {
    margin-top: 8px;
    font-size: 0.8em;
    color: #666;
  }
  #controls {
    margin-top: 4px;
    font-size: 0.85em;
    color: #888;
    text-align: center;
  }
  input[type="file"] { display: none; }
  #rom-selector {
    margin-bottom: 12px;
  }
  #rom-selector.hidden { display: none; }
  #rom-selector select {
    background: #2a2a4e;
    color: #eee;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 0.95em;
    cursor: pointer;
  }
  #rom-selector select:hover { border-color: #8be9fd; }
</style>
</head>
<body>
  <h1>VibeBoy</h1>
  <div id="rom-selector" class="hidden">
    <select id="rom-select">
      <option value="">-- Select a built-in ROM --</option>
    </select>
  </div>
  <div id="drop-zone">
    Drop a .gb / .gbc ROM here<br>
    <small>or click to browse, or select a built-in ROM above</small>
    <input type="file" id="file-input" accept=".gb,.gbc,.sgb,.bin">
  </div>
  <div id="canvas-wrapper">
    <canvas id="screen" width="160" height="144"></canvas>
    <canvas id="screen-2d" width="160" height="144" style="display:none;"></canvas>
  </div>
  <div id="status"></div>
  <div id="filter-bar" style="margin-top:8px; display:flex; gap:8px; align-items:center;">
    <select id="model-select" style="background:#2a2a4e; color:#eee; border:1px solid #555; border-radius:4px; padding:4px 8px; font-size:0.9em;">
      <option value="auto">Auto</option>
      <option value="dmg">DMG</option>
      <option value="mgb">MGB</option>
      <option value="sgb">SGB</option>
      <option value="sgb2">SGB2</option>
      <option value="cgb">CGB</option>
      <option value="agb">AGB</option>
    </select>
    <select id="filter-select" style="background:#2a2a4e; color:#eee; border:1px solid #555; border-radius:4px; padding:4px 8px; font-size:0.9em;">
      <option value="vectorize">Vectorize</option>
      <option value="omniscale">OmniScale</option>
      <option value="omniscale-legacy">OmniScale Legacy</option>
      <option value="hqx">HQx</option>
      <option value="xbr">xBR</option>
      <option value="xbrz">xBRZ</option>
      <option value="super-xbr">Super xBR</option>
      <option value="epx">EPX / Scale2x</option>
      <option value="eagle">Eagle</option>
      <option value="scale3x">Scale3x</option>
      <option value="bicubic">Bicubic</option>
      <option value="aa-nearest">AA Nearest</option>
      <option value="edi">EDI</option>
      <option value="nedi">NEDI</option>
      <option value="dcci">DCCI</option>
      <option value="nearest">Nearest</option>
    </select>
  </div>
  <div id="controls">
    Arrows: D-pad &nbsp; Z: B &nbsp; X: A &nbsp; Enter: Start &nbsp; Shift: Select &nbsp; | &nbsp; F5: Save &nbsp; F7: Load &nbsp; 1-9: Slot &nbsp; | &nbsp; Gamepad
  </div>
  <!-- Hidden elements for webcam capture -->
  <video id="cam-video" autoplay playsinline style="display:none;"></video>
  <canvas id="cam-canvas" width="128" height="112" style="display:none;"></canvas>

<!-- ROM selector: runs immediately, independent of wasm loading -->
<script>
(function() {
  var BUNDLED_ROMS = [
    'Drymouth.gb',
    'GB Lander.gb',
    'Horrible Demon 3.gb',
    'Hungry are the Dead.gbc',
    'Iron Hike.gb',
    'Jet Pak DX.gb',
    'Mainblow.gbc',
    'Marcbla 3D.gb',
    'Megamania.gb',
    'Moon Fighter.gbc',
    'Mr. Dig.gbc',
    'Poke Mission 97.gb',
    'Q-Bert.gbc',
    'Shutdown.gb',
    'Skoardy.gb',
    'Sokoban.gb',
    'Sqrxz.gb',
    'The Horrible Demon.gb',
    'They Came From Outer Space.gb',
    'Tic-Tac-Toe.gb',
    'Ultima III.gb',
    'Yars Revenge.gb',
  ];

  var romSelect = document.getElementById('rom-select');
  var romSelector = document.getElementById('rom-selector');

  // Probe a single ROM to detect if roms/ directory exists, then show all
  fetch('roms/Sokoban.gb', { method: 'HEAD' }).then(function(r) {
    if (!r.ok) return;
    for (var i = 0; i < BUNDLED_ROMS.length; i++) {
      var name = BUNDLED_ROMS[i];
      var opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name.replace(/\.(gb|gbc)$/i, '');
      romSelect.appendChild(opt);
    }
    romSelector.classList.remove('hidden');
  }).catch(function() {});

  // ROM selection handler — stores chosen ROM, the module script picks it up
  window._pendingRom = null;
  romSelect.addEventListener('change', function() {
    var name = romSelect.value;
    if (!name) return;
    document.getElementById('status').textContent = 'Loading ' + name.replace(/\.(gb|gbc)$/i, '') + '...';
    fetch('roms/' + encodeURIComponent(name)).then(function(resp) {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.arrayBuffer();
    }).then(function(buf) {
      if (window._startEmulator) {
        window._startEmulator(buf);
      } else {
        window._pendingRom = buf;
      }
    }).catch(function(e) {
      document.getElementById('status').textContent = 'Failed to load ROM: ' + e.message;
    });
  });
})();
</script>

<script type="module">
import init, { WasmEmulator, wasm_memory, btn_a, btn_b, btn_up, btn_down, btn_left, btn_right, btn_start, btn_select } from './pkg/vibeboy.js';

let printCount = 0;
function checkForPrint() {
  if (!emu || !emu.has_print()) return;
  const rgba = emu.take_print_rgba();
  const w = emu.print_width();
  const h = emu.print_height();
  if (w === 0 || h === 0) return;

  // Render to an offscreen canvas and download as PNG
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const cx = c.getContext('2d');
  const img = new ImageData(new Uint8ClampedArray(rgba.buffer, rgba.byteOffset, rgba.byteLength), w, h);
  cx.putImageData(img, 0, 0);
  c.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `print_${String(++printCount).padStart(4,'0')}.png`;
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/png');
}

let emu = null;
let useGpu = false;
const canvas = document.getElementById('screen');
const canvas2d = document.getElementById('screen-2d');
let ctx = null;
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const status = document.getElementById('status');
const filterBar = document.getElementById('filter-bar');
const filterSelect = document.getElementById('filter-select');

// Load wasm eagerly
let keyMap = {};
await init();
// Expose startEmulator for the ROM selector script
window._startEmulator = startEmulator;
// If a ROM was selected before wasm loaded, start it now
if (window._pendingRom) {
  startEmulator(window._pendingRom);
  window._pendingRom = null;
}
keyMap = {
  'ArrowUp':    btn_up(),
  'ArrowDown':  btn_down(),
  'ArrowLeft':  btn_left(),
  'ArrowRight': btn_right(),
  'KeyZ':       btn_b(),
  'KeyX':       btn_a(),
  'Enter':      btn_start(),
  'ShiftLeft':  btn_select(),
  'ShiftRight': btn_select(),
};

let audioCtx = null;

let audioWorklet = null;

async function initAudio() {
  try {
    audioCtx = new AudioContext({ sampleRate: 96000 });

    const workletCode = `
class EmuAudioProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.buf = new Float32Array(0);
    this.pos = 0;
    this.port.onmessage = (e) => {
      // Append incoming samples to internal buffer
      const incoming = e.data;
      const newBuf = new Float32Array(this.buf.length - this.pos + incoming.length);
      newBuf.set(this.buf.subarray(this.pos));
      newBuf.set(incoming, this.buf.length - this.pos);
      this.buf = newBuf;
      this.pos = 0;
    };
  }
  process(inputs, outputs) {
    const outL = outputs[0][0];
    const outR = outputs[0][1];
    if (!outL) return true;
    for (let i = 0; i < outL.length; i++) {
      if (this.pos < this.buf.length - 1) {
        outL[i] = this.buf[this.pos];
        outR[i] = this.buf[this.pos + 1];
        this.pos += 2;
      } else {
        outL[i] = 0;
        outR[i] = 0;
      }
    }
    // Compact buffer when mostly consumed
    if (this.pos > 16384) {
      this.buf = this.buf.slice(this.pos);
      this.pos = 0;
    }
    return true;
  }
}
registerProcessor('emu-audio', EmuAudioProcessor);
`;
    const blob = new Blob([workletCode], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    await audioCtx.audioWorklet.addModule(url);
    URL.revokeObjectURL(url);

    audioWorklet = new AudioWorkletNode(audioCtx, 'emu-audio', {
      outputChannelCount: [2],
    });
    audioWorklet.connect(audioCtx.destination);
    console.log('AudioWorklet initialized at', audioCtx.sampleRate, 'Hz');
  } catch (e) {
    console.warn('AudioWorklet init failed:', e);
  }
}

function pushAudioSamples() {
  if (!emu || !audioWorklet) return;
  emu.audio_drain();
  const ptr = emu.audio_ptr();
  const len = emu.audio_len();
  if (len === 0) return;
  const samples = new Float32Array(wasm_memory().buffer, ptr, len);
  // Copy and send to worklet (can't transfer wasm memory views)
  const copy = new Float32Array(len);
  copy.set(samples);
  audioWorklet.port.postMessage(copy, [copy.buffer]);
}

// Webcam for Pocket Camera
const camVideo = document.getElementById('cam-video');
const camCanvas = document.getElementById('cam-canvas');
const camCtx = camCanvas.getContext('2d', { willReadFrequently: true });
let cameraActive = false;
const camGrayscale = new Uint8Array(128 * 112);

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 128 }, height: { ideal: 112 }, facingMode: 'user' }
    });
    camVideo.srcObject = stream;
    cameraActive = true;
    console.log('Webcam active for Pocket Camera');
  } catch (e) {
    console.warn('Webcam unavailable:', e);
  }
}

function feedCameraFrame() {
  if (!cameraActive || !emu || camVideo.readyState < 2) return;
  // Draw video frame scaled to 128x112, mirrored horizontally
  camCtx.save();
  camCtx.translate(128, 0);
  camCtx.scale(-1, 1);
  camCtx.drawImage(camVideo, 0, 0, 128, 112);
  camCtx.restore();
  // Convert to grayscale
  const rgba = camCtx.getImageData(0, 0, 128, 112).data;
  for (let i = 0; i < 128 * 112; i++) {
    const r = rgba[i * 4], g = rgba[i * 4 + 1], b = rgba[i * 4 + 2];
    camGrayscale[i] = (r * 77 + g * 150 + b * 29) >> 8;
  }
  emu.set_camera_image(camGrayscale);
}

async function startEmulator(romBytes) {
  emu = new WasmEmulator(new Uint8Array(romBytes));
  const w = emu.width();
  const h = emu.height();

  // Init audio (requires user gesture — file pick/drop counts)
  await initAudio();

  // Try WebGPU
  if (navigator.gpu) {
    try {
      canvas.width = w * 4;
      canvas.height = h * 4;
      await emu.init_gpu(canvas);
      useGpu = true;
      status.textContent = 'Rendering: WebGPU vectorize';
      // Also prepare 2D canvas for NN toggle
      canvas2d.width = w;
      canvas2d.height = h;
      ctx = canvas2d.getContext('2d');
    } catch (e) {
      console.warn('WebGPU init failed, falling back to Canvas2D:', e);
      useGpu = false;
    }
  }

  if (!useGpu) {
    canvas.width = w;
    canvas.height = h;
    ctx = canvas.getContext('2d');
    status.textContent = 'Rendering: Canvas2D';
  }

  // Load save from localStorage if available
  if (emu.has_battery()) {
    const key = emu.save_key();
    const saved = localStorage.getItem(key);
    if (saved) {
      const bytes = Uint8Array.from(atob(saved), c => c.charCodeAt(0));
      emu.load_save(bytes);
      console.log('Loaded save from localStorage:', key);
    }
  }

  // Attach printer, start webcam and accelerometer if needed
  emu.attach_printer();
  if (emu.has_camera()) initCamera();
  initAccelerometer();

  if (useGpu) filterBar.style.display = '';
  requestAnimationFrame(frame);
}

filterSelect.addEventListener('change', () => {
  if (!emu) return;
  const name = filterSelect.value;
  emu.set_filter(name);
  if (name === 'nearest') {
    status.textContent = 'Rendering: Nearest neighbor';
    canvas.style.display = 'none';
    canvas2d.style.display = '';
  } else {
    status.textContent = 'Rendering: ' + filterSelect.options[filterSelect.selectedIndex].text;
    canvas.style.display = '';
    canvas2d.style.display = 'none';
  }
});

const modelSelect = document.getElementById('model-select');
modelSelect.addEventListener('change', () => {
  if (!emu) return;
  emu.set_model(modelSelect.value);
  status.textContent = 'Model: ' + modelSelect.options[modelSelect.selectedIndex].text;
});

let saveCounter = 0;
const GB_FRAME_MS = 1000.0 / 59.7275; // ~16.74ms per Game Boy frame
let emuTime = 0;
let lastTimestamp = 0;

function frame(timestamp) {
  if (!emu) return;
  if (lastTimestamp === 0) lastTimestamp = timestamp;

  emuTime += timestamp - lastTimestamp;
  lastTimestamp = timestamp;

  // Cap catchup to avoid spiral of death (e.g. tab was backgrounded)
  if (emuTime > GB_FRAME_MS * 3) emuTime = GB_FRAME_MS * 3;

  // Poll gamepad and accelerometer each frame
  pollGamepad();
  feedAccelerometer();

  // Step emulation at GB native rate, independent of display refresh
  let stepped = false;
  while (emuTime >= GB_FRAME_MS) {
    if (cameraActive) feedCameraFrame();
    emu.step_frame();
    if (audioWorklet) pushAudioSamples();
    emuTime -= GB_FRAME_MS;
    stepped = true;
    checkForPrint();
    saveCounter++;
    updateRumble();
    if (saveCounter >= 60 && emu.has_battery()) {
      saveCounter = 0;
      const data = emu.save_data();
      let bin = '';
      for (let i = 0; i < data.length; i++) bin += String.fromCharCode(data[i]);
      localStorage.setItem(emu.save_key(), btoa(bin));
    }
  }

  // Resize GPU surface to match wrapper size, preserving 10:9 aspect ratio
  if (useGpu) {
    const wrapper = document.getElementById('canvas-wrapper');
    const cw = wrapper.clientWidth;
    const ch = wrapper.clientHeight;
    // Fit 10:9 aspect ratio within wrapper
    let tw, th;
    if (cw * 9 <= ch * 10) {
      tw = cw;
      th = Math.round(cw * 9 / 10);
    } else {
      th = ch;
      tw = Math.round(ch * 10 / 9);
    }
    if (tw > 0 && th > 0 && (canvas.width !== tw || canvas.height !== th)) {
      canvas.width = tw;
      canvas.height = th;
      emu.resize_gpu(tw, th);
    }
  }

  // Only render if we stepped at least one frame
  if (stepped) {
    if (useGpu && emu.render_gpu()) {
      // GPU rendered successfully
    } else if (ctx) {
      emu.frame_buffer_update();
      const ptr = emu.frame_buffer_ptr();
      const len = emu.frame_buffer_len();
      const w = emu.width();
      const h = emu.height();
      const rgba = new Uint8ClampedArray(wasm_memory().buffer, ptr, len);
      const img = new ImageData(rgba, w, h);
      ctx.putImageData(img, 0, 0);
    }
  }
  requestAnimationFrame(frame);
}

// Accelerometer (MBC7 / Kirby Tilt 'n' Tumble)
let accelActive = false;
let accelX = 0, accelY = 0;

function initAccelerometer() {
  if (!emu || !emu.has_accelerometer()) return;

  // Try DeviceMotion API (mobile devices)
  if (window.DeviceMotionEvent) {
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      // iOS 13+ requires user gesture for permission
      DeviceMotionEvent.requestPermission().then(state => {
        if (state === 'granted') enableDeviceMotion();
      }).catch(() => {});
    } else {
      enableDeviceMotion();
    }
  }
}

function enableDeviceMotion() {
  window.addEventListener('devicemotion', e => {
    if (e.accelerationIncludingGravity) {
      accelX = (e.accelerationIncludingGravity.x || 0) / 9.81;
      accelY = (e.accelerationIncludingGravity.y || 0) / 9.81;
      accelActive = true;
    }
  });
  console.log('DeviceMotion accelerometer active for MBC7');
}

function feedAccelerometer() {
  if (!emu || !accelActive) return;
  emu.set_accelerometer(accelX, accelY);
}

// Save states (localStorage)
let currentSlot = 0;

function saveStateKey(slot) {
  if (!emu) return null;
  return 'vibeboy_ss_' + emu.save_key() + '_' + slot;
}

function saveState() {
  if (!emu) return;
  const data = emu.save_state_to_bytes(currentSlot);
  if (data && data.length > 0) {
    const key = saveStateKey(currentSlot);
    let bin = '';
    for (let i = 0; i < data.length; i++) bin += String.fromCharCode(data[i]);
    try {
      localStorage.setItem(key, btoa(bin));
      status.textContent = 'State saved to slot ' + (currentSlot + 1);
    } catch (e) {
      status.textContent = 'Save state failed: ' + e.message;
    }
  }
}

function loadState() {
  if (!emu) return;
  const key = saveStateKey(currentSlot);
  const saved = localStorage.getItem(key);
  if (saved) {
    const bytes = Uint8Array.from(atob(saved), c => c.charCodeAt(0));
    if (emu.load_state_from_bytes(currentSlot, bytes)) {
      status.textContent = 'State loaded from slot ' + (currentSlot + 1);
    } else {
      status.textContent = 'Failed to load state (incompatible version?)';
    }
  } else {
    status.textContent = 'Slot ' + (currentSlot + 1) + ' is empty';
  }
}

// Keyboard input
document.addEventListener('keydown', e => {
  if (!emu) return;
  // Save state slots: 1-9 select slot, F5 save, F7 load
  if (e.code >= 'Digit1' && e.code <= 'Digit9') {
    currentSlot = parseInt(e.code.charAt(5)) - 1;
    status.textContent = 'Slot ' + (currentSlot + 1) + ' selected';
    e.preventDefault(); return;
  }
  if (e.code === 'F5') { saveState(); e.preventDefault(); return; }
  if (e.code === 'F7') { loadState(); e.preventDefault(); return; }

  const btn = keyMap[e.code];
  if (btn !== undefined) { emu.set_button(btn, true); e.preventDefault(); }
});
document.addEventListener('keyup', e => {
  const btn = keyMap[e.code];
  if (btn !== undefined && emu) { emu.set_button(btn, false); e.preventDefault(); }
});

// Gamepad input — polled each frame
const STICK_DEADZONE = 0.4;
const gpBtnMap = [
  [0, btn_b()],       // South (A/Cross) → B
  [1, btn_a()],       // East (B/Circle) → A
  [8, btn_select()],  // Back/Select
  [9, btn_start()],   // Start
  [12, btn_up()],     // D-pad up
  [13, btn_down()],   // D-pad down
  [14, btn_left()],   // D-pad left
  [15, btn_right()],  // D-pad right
];
let gpPrevState = {};
let rumbleWasOn = false;

function pollGamepad() {
  if (!emu) return;
  const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const gp of gamepads) {
    if (!gp) continue;

    // D-pad buttons
    for (const [gi, emuBtn] of gpBtnMap) {
      if (gi < gp.buttons.length) {
        const pressed = gp.buttons[gi].pressed;
        const key = gp.index + '_' + gi;
        if (gpPrevState[key] !== pressed) {
          emu.set_button(emuBtn, pressed);
          gpPrevState[key] = pressed;
        }
      }
    }

    // Left stick → D-pad
    if (gp.axes.length >= 2) {
      const lx = gp.axes[0];
      const ly = gp.axes[1];
      const stickLeft = lx < -STICK_DEADZONE;
      const stickRight = lx > STICK_DEADZONE;
      const stickUp = ly < -STICK_DEADZONE;
      const stickDown = ly > STICK_DEADZONE;

      const sk = gp.index + '_s';
      const prev = gpPrevState[sk] || {};
      if (prev.l !== stickLeft)  { emu.set_button(btn_left(), stickLeft); }
      if (prev.r !== stickRight) { emu.set_button(btn_right(), stickRight); }
      if (prev.u !== stickUp)    { emu.set_button(btn_up(), stickUp); }
      if (prev.d !== stickDown)  { emu.set_button(btn_down(), stickDown); }
      gpPrevState[sk] = { l: stickLeft, r: stickRight, u: stickUp, d: stickDown };
    }

    break; // Use first connected gamepad only
  }
}

function updateRumble() {
  if (!emu || !emu.has_rumble()) return;
  const on = emu.rumble_active();
  if (on === rumbleWasOn) return;
  rumbleWasOn = on;
  const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const gp of gamepads) {
    if (!gp || !gp.vibrationActuator) continue;
    if (on) {
      gp.vibrationActuator.playEffect('dual-rumble', {
        duration: 200,
        strongMagnitude: 0.6,
        weakMagnitude: 0.4,
      }).catch(() => {});
    } else {
      gp.vibrationActuator.reset().catch(() => {});
    }
    break;
  }
}

// File loading
function loadFile(file) {
  const reader = new FileReader();
  reader.onload = () => startEmulator(reader.result);
  reader.readAsArrayBuffer(file);
}

dropZone.addEventListener('click', () => fileInput.click());
document.getElementById('canvas-wrapper').addEventListener('dblclick', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('hover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('hover');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});

</script>
