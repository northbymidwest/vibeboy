[package]
name = "vibeboy"
version = "0.1.0"
edition = "2024"

[workspace]
exclude = ["test-roms/mooneye-gb"]

[[bin]]
name = "vibeboy"
path = "src/main.rs"

[[bin]]
name = "test_runner"
path = "src/test_runner.rs"

[dependencies]
sdl3 = { version = "0.17", features = ["hidapi"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
image = "0.25"
