[package]
name = "vibeboy"
version = "0.1.0"
edition = "2024"
default-run = "vibeboy"

[workspace]
exclude = ["test-roms/mooneye-gb"]

[[bin]]
name = "vibeboy"
path = "src/main.rs"

[[bin]]
name = "test_runner"
path = "src/test_runner/main.rs"

[dependencies]
sdl3 = { version = "0.17", features = ["hidapi"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
image = "0.25"
svg = "0.18.0"
wgpu = { version = "24", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }
winit = { version = "0.30", optional = true }
muda = { version = "0.15", optional = true }
cpal = { version = "0.15", optional = true }
rfd = { version = "0.15", optional = true }
nokhwa = { version = "0.10", features = ["input-native", "output-threaded"], optional = true }
gilrs = { version = "0.11", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
metal = "0.29"
core-graphics-types = "0.1.3"
block2 = "0.6"

[[bin]]
name = "vibeboy_cocoa"
path = "src/cocoa_ui.rs"
required-features = ["macos-ui"]

[[bin]]
name = "vibeboy_winit"
path = "src/winit_ui.rs"
required-features = ["winit-ui"]

[features]
macos-ui = []
gpu = ["wgpu", "bytemuck", "pollster"]
winit-ui = ["winit", "wgpu", "bytemuck", "pollster", "muda", "cpal", "rfd", "nokhwa", "gilrs"]
