[package]
name = "vibeboy"
version = "0.1.0"
edition = "2024"
default-run = "vibeboy"
description = "Game Boy / Game Boy Color emulator with pixel-art vectorization"
repository = "https://github.com/northbymidwest/vibeboy"
license = "0BSD"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vibeboy"
path = "src/frontends/sdl/main.rs"

[[bin]]
name = "test_runner"
path = "src/test_runner/main.rs"

[dependencies]
log = "0.4"
sdl3 = { version = "0.17", features = ["hidapi"], optional = true }
env_logger = { version = "0.11", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
clap_complete = { version = "4", optional = true }
image = { version = "0.25", optional = true }
svg = { version = "0.18.0", optional = true }
wgpu = { version = "29", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }
winit = { version = "0.30", optional = true }
muda = { version = "0.17", optional = true }
cpal = { version = "0.17", optional = true }
rfd = { version = "0.17", optional = true }
nokhwa = { version = "0.10", features = ["input-native", "output-threaded"], optional = true }
gilrs = { version = "0.11", optional = true }
gtk4 = { version = "0.11", optional = true, features = ["v4_10"] }
cairo-rs = { version = "0.22", optional = true, features = ["v1_16"] }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window", "Document", "HtmlCanvasElement", "CanvasRenderingContext2d",
    "ImageData", "KeyboardEvent", "HtmlInputElement", "FileReader",
    "DragEvent", "DataTransfer", "FileList", "File", "Blob",
    "EventTarget", "Event", "Performance", "Storage",
] }
js-sys = { version = "0.3", optional = true }
console_log = { version = "1", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde-big-array = "0.5"
bincode = { version = "2", features = ["serde"] }
gdk4-macos = { version = "0.11.0", optional = true }
raw-window-handle = { version = "0.6.2", optional = true }
gdk4-wayland = { version = "0.11.0", optional = true }
gdk4-x11 = { version = "0.11.0", optional = true }
glow = { version = "0.16", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSFont", "NSControl", "NSWindow", "NSView", "NSEvent", "NSGraphics", "NSResponder", "NSMenu", "NSMenuItem", "NSApplication", "NSCell", "NSPanel", "NSSavePanel", "NSOpenPanel", "NSTextField", "NSButton", "NSButtonCell", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-metal = "0.3"
objc2-quartz-core = "0.3"
objc2-game-controller = { version = "0.3", features = ["objc2-core-haptics"] }
objc2-core-haptics = { version = "0.3", features = ["alloc", "CHHapticEngine", "CHHapticEvent", "CHHapticParameter", "CHHapticPattern", "CHHapticPatternPlayer"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVCaptureSession", "AVCaptureSessionPreset", "AVCaptureVideoDataOutput", "AVMediaFormat", "AVCaptureOutputBase", "objc2-core-media"] }
objc2-core-media = "0.3"
objc2-core-motion = { version = "0.3", features = ["CMMotionManager", "CMAccelerometer", "CMLogItem"] }
dispatch2 = "0.3"
block2 = "0.6"

[[bin]]
name = "vibeboy_cocoa"
path = "src/frontends/cocoa/main.rs"
required-features = ["macos-ui"]

[[bin]]
name = "vibeboy_winit"
path = "src/frontends/winit/main.rs"
required-features = ["winit-ui"]

[[bin]]
name = "vibeboy_gtk"
path = "src/frontends/gtk/main.rs"
required-features = ["gtk-ui"]

[build-dependencies]
naga = { version = "29", features = ["spv-in", "wgsl-out"] }

[features]
default = ["native", "sdl3-gpu-shaders"]
native = ["sdl3", "clap", "clap_complete", "env_logger", "image", "svg"]
macos-ui = []
sdl3-gpu-shaders = []
gpu = ["wgpu", "bytemuck", "pollster"]
winit-ui = ["winit", "wgpu", "bytemuck", "pollster", "muda", "cpal", "rfd", "nokhwa", "gilrs"]
gtk-ui = ["gtk4", "cairo-rs", "clap", "env_logger", "cpal", "image", "svg", "gilrs", "glow"]
gtk-ui-linux = ["gtk-ui"]
gtk-ui-macos = ["gtk-ui"]
web = ["wgpu", "bytemuck", "wasm-bindgen", "web-sys", "js-sys", "console_log", "wasm-bindgen-futures", "console_error_panic_hook"]
gdk4-macos = ["dep:gdk4-macos"]
gdk4-wayland = ["dep:gdk4-wayland"]
gdk4-x11 = ["dep:gdk4-x11"]
