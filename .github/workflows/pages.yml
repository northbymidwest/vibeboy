name: pages

# Builds the WebAssembly frontend and publishes web/ to GitHub Pages, with
# the same script a developer runs locally. Every push to main that can
# change the page deploys it; nothing is committed anywhere.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'build.rs'
      - 'build_support/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/build-web.sh'
      - 'scripts/fetch-pdroms.sh'
      - '.github/workflows/pages.yml'
      - '.github/actions/setup-native/**'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one halfway: the newest push
# queues behind it and publishes next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      # slangc only: the shaders are compiled to WGSL at build time, but the
      # web build links no SDL.
      - uses: $/.github/actions/setup-native
        with:
          sdl: 'false'
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: wasm-pack@0.15.0

      # No build or ROM cache on purpose: this job publishes, so nothing it
      # ships should come from a cache another workflow could have written.
      - run: ./scripts/build-web.sh --roms

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
