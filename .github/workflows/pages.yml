name: pages

# Builds the WebAssembly frontend and publishes web/ to GitHub Pages, with
# the same script a developer runs locally. Manual only: a release of the
# page is a decision, not a side effect of pushing to main. Run it from the
# Actions tab or with `gh workflow run pages.yml`.
on:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one halfway: a second run
# queues behind it and publishes next.
concurrency:
  group: pages
  cancel-in-progress: false

# Plain rustup sets neither; dtolnay/rust-toolchain used to.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --no-self-update -t wasm32-unknown-unknown && rustup default stable
      # slangc only: the shaders are compiled to WGSL at build time, but the
      # web build links no SDL.
      - uses: $/.github/actions/setup-native
        with:
          sdl: 'false'
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: wasm-pack@0.15.0

      # No build or ROM cache on purpose: this job publishes, so nothing it
      # ships should come from a cache another workflow could have written.
      - run: ./scripts/build-web.sh --roms

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
