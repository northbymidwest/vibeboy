name: accuracy

# The test ROM suites, through `scripts/accuracy.sh`, against the per-test
# baseline in `tests/accuracy-baseline.txt`. Accuracy work routinely trades
# a few tests for a better model, so a lower count alone is not a failure:
# a lost test is, until the commit that loses it also updates the baseline
# (`./scripts/accuracy.sh --update`) and says why. The run summary lists
# every test gained or lost; the artifact holds each suite's raw output and
# the full result list, `results/accuracy.txt`, in the baseline's format.
#
# c-sp/game-boy-test-roms is fetched by the same script a developer uses
# and cached by its release tag, which is pinned inside that script.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: $/.github/actions/setup-native
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: roms
        with:
          path: game-boy-test-roms
          key: game-boy-test-roms-${{ hashFiles('scripts/fetch-test-roms.sh') }}
      - if: steps.roms.outputs.cache-hit != 'true'
        run: ./scripts/fetch-test-roms.sh

      - run: cargo build --release --locked --bin test_runner

      - name: Compare against the baseline
        run: ./scripts/accuracy.sh --no-build --results results --markdown "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: accuracy-results
          path: results/
          if-no-files-found: warn
