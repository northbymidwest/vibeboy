name: Set up native build dependencies
description: >
  SDL3 and slangc, the two things build.rs needs that a stock runner lacks.
  SDL3 is found through pkg-config (`[package.metadata.system-deps]`), and
  slangc compiles every shader at build time, so nothing builds without both.

inputs:
  sdl:
    description: Set up SDL3. The web build compiles shaders but links no SDL.
    default: 'true'
  gtk:
    description: >
      Also install GTK 4 and the ALSA and udev headers that the gtk-ui
      frontend links (cpal and gilrs). Linux only.
    default: 'false'

runs:
  using: composite
  steps:
    # No distribution package on the runner images is new enough: the floor is
    # 3.4, and Ubuntu 24.04 ships no SDL3 at all. This builds the pinned
    # release from source, caches it, and puts its sdl3.pc on
    # PKG_CONFIG_PATH. `add-to-environment` puts the shared library on the
    # loader path too, which the test binaries need to start at all.
    - uses: libsdl-org/setup-sdl@30cb786f3595c27d05018cd374b679f2313c59d3 # v1.0.1
      if: inputs.sdl == 'true'
      with:
        version: 3.4.16
        build-type: Release
        install-linux-dependencies: true
        add-to-environment: true

    # The runner image has the runtime libraries but not the headers and
    # .pc files. Ubuntu 24.04's GTK is 4.14, over the 4.10 the gtk4 crate's
    # `v4_10` feature asks for.
    - name: Install GTK 4
      if: runner.os == 'Linux' && inputs.gtk == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libgtk-4-dev libasound2-dev libudev-dev

    # system-deps shells out to pkg-config to read sdl3.pc, and the Windows
    # images ship none. Chocolatey is preinstalled there.
    - name: Install pkg-config
      if: runner.os == 'Windows' && inputs.sdl == 'true'
      shell: pwsh
      run: choco install pkgconfiglite --version 0.28 --no-progress -y

    # Pinned by version and by the digest GitHub records for each release
    # asset. A different slangc can emit different SPIR-V, MSL or WGSL, so
    # moving this is a deliberate change like any other.
    # The GITHUB_PATH write adds a fixed directory under RUNNER_TEMP; nothing
    # in it comes from the triggering event.
    - name: Install slangc
      shell: bash
      env:
        SLANG_VERSION: 2026.18.3
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        case "$RUNNER_OS" in
          Linux)
            asset="slang-$SLANG_VERSION-linux-x86_64.tar.gz"
            sha=4d664ca905124ae68204ee05170f5acd8dc53956baf850b2e7b23215cfb78f7b ;;
          macOS)
            asset="slang-$SLANG_VERSION-macos-aarch64.tar.gz"
            sha=6c8bf066a4254e8d053f864a52ea18388702d409ed9f20b3d6da66e8d772c906 ;;
          Windows)
            asset="slang-$SLANG_VERSION-windows-x86_64.zip"
            sha=1339d7b3050ae680c11152b8ccff977173591ce8e9c1d2a5cff2eb904d52e50d ;;
          *)
            echo "::error::no slangc for $RUNNER_OS"; exit 1 ;;
        esac
        dest="$RUNNER_TEMP/slang"
        mkdir -p "$dest"
        # --retry alone skips TLS errors, so retry everything. On Windows,
        # curl's schannel backend fails the handshake outright when the CA's
        # revocation server is unreachable (CRYPT_E_REVOCATION_OFFLINE, exit
        # 35); make that check best effort there. The download is verified
        # against a pinned sha256 below either way.
        curl_opts=(-fsSL --retry 3 --retry-all-errors)
        if [ "$RUNNER_OS" = Windows ]; then
          curl_opts+=(--ssl-revoke-best-effort)
        fi
        curl "${curl_opts[@]}" -o "$RUNNER_TEMP/$asset" \
          "https://github.com/shader-slang/slang/releases/download/v$SLANG_VERSION/$asset"
        # sha256sum on Linux and Git Bash, shasum on macOS.
        if command -v sha256sum >/dev/null; then
          echo "$sha  $RUNNER_TEMP/$asset" | sha256sum -c -
        else
          echo "$sha  $RUNNER_TEMP/$asset" | shasum -a 256 -c -
        fi
        case "$asset" in
          *.zip) unzip -q "$RUNNER_TEMP/$asset" -d "$dest" ;;
          *) tar -xzf "$RUNNER_TEMP/$asset" -C "$dest" ;;
        esac
        echo "$dest/bin" >> "$GITHUB_PATH"
        "$dest/bin/slangc" -v
