<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VibeBoy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  h1 { margin-bottom: 12px; font-size: 1.4em; color: #8be9fd; }
  #drop-zone {
    border: 2px dashed #555;
    border-radius: 8px;
    padding: 40px;
    text-align: center;
    cursor: pointer;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  #drop-zone.hover { border-color: #8be9fd; }
  #drop-zone.hidden { display: none; }
  #canvas-wrapper {
    resize: both;
    overflow: hidden;
    border: 2px solid #333;
    border-radius: 4px;
    width: 640px;
    height: 576px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  #canvas-wrapper canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 10 / 9;
  }
  #status {
    margin-top: 8px;
    font-size: 0.8em;
    color: #666;
  }
  #controls {
    margin-top: 4px;
    font-size: 0.85em;
    color: #888;
    text-align: center;
  }
  input[type="file"] { display: none; }
  #rom-selector {
    margin-bottom: 12px;
    display: none;
  }
  #rom-selector select {
    background: #2a2a4e;
    color: #eee;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 0.95em;
    cursor: pointer;
  }
  #rom-selector select:hover { border-color: #8be9fd; }
</style>
</head>
<body>
  <h1>VibeBoy</h1>
  <div id="rom-selector">
    <select id="rom-select">
      <option value="">-- Select a built-in ROM --</option>
    </select>
  </div>
  <div id="drop-zone">
    Drop a .gb / .gbc ROM here<br>
    <small>or click to browse, or select a built-in ROM above</small>
    <input type="file" id="file-input" accept=".gb,.gbc,.sgb,.bin">
  </div>
  <div id="canvas-wrapper">
    <canvas id="screen" width="160" height="144"></canvas>
    <canvas id="screen-2d" width="160" height="144" style="display:none;"></canvas>
  </div>
  <div id="status"></div>
  <button id="toggle-filter" style="margin-top:8px; padding:4px 12px; display:none;">Switch to Nearest</button>
  <div id="controls">
    Arrows: D-pad &nbsp; Z: B &nbsp; X: A &nbsp; Enter: Start &nbsp; Shift: Select
  </div>
  <!-- Hidden elements for webcam capture -->
  <video id="cam-video" autoplay playsinline style="display:none;"></video>
  <canvas id="cam-canvas" width="128" height="112" style="display:none;"></canvas>

<script type="module">
import init, { WasmEmulator, wasm_memory, btn_a, btn_b, btn_up, btn_down, btn_left, btn_right, btn_start, btn_select } from './pkg/vibeboy.js';

let printCount = 0;
function checkForPrint() {
  if (!emu || !emu.has_print()) return;
  const rgba = emu.take_print_rgba();
  const w = emu.print_width();
  const h = emu.print_height();
  if (w === 0 || h === 0) return;

  // Render to an offscreen canvas and download as PNG
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const cx = c.getContext('2d');
  const img = new ImageData(new Uint8ClampedArray(rgba.buffer, rgba.byteOffset, rgba.byteLength), w, h);
  cx.putImageData(img, 0, 0);
  c.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `print_${String(++printCount).padStart(4,'0')}.png`;
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/png');
}

let emu = null;
let useGpu = false;
const canvas = document.getElementById('screen');
const canvas2d = document.getElementById('screen-2d');
let ctx = null;
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const status = document.getElementById('status');
const toggleBtn = document.getElementById('toggle-filter');

// Load wasm eagerly
let keyMap = {};
await init();
keyMap = {
  'ArrowUp':    btn_up(),
  'ArrowDown':  btn_down(),
  'ArrowLeft':  btn_left(),
  'ArrowRight': btn_right(),
  'KeyZ':       btn_b(),
  'KeyX':       btn_a(),
  'Enter':      btn_start(),
  'ShiftLeft':  btn_select(),
  'ShiftRight': btn_select(),
};

// Audio ring buffer (filled by emu, drained by Web Audio)
const AUDIO_BUF_SIZE = 65536;
let audioBuf = new Float32Array(AUDIO_BUF_SIZE * 2); // interleaved stereo
let audioWritePos = 0;
let audioReadPos = 0;
let audioCtx = null;

function initAudio() {
  try {
    audioCtx = new AudioContext({ sampleRate: 96000 });
    const node = audioCtx.createScriptProcessor(4096, 0, 2);
    node.onaudioprocess = (e) => {
      const outL = e.outputBuffer.getChannelData(0);
      const outR = e.outputBuffer.getChannelData(1);
      for (let i = 0; i < outL.length; i++) {
        if (audioReadPos !== audioWritePos) {
          outL[i] = audioBuf[audioReadPos * 2];
          outR[i] = audioBuf[audioReadPos * 2 + 1];
          audioReadPos = (audioReadPos + 1) % AUDIO_BUF_SIZE;
        } else {
          outL[i] = 0;
          outR[i] = 0;
        }
      }
    };
    node.connect(audioCtx.destination);
    console.log('Web Audio initialized at', audioCtx.sampleRate, 'Hz');
  } catch (e) {
    console.warn('Web Audio init failed:', e);
  }
}

function pushAudioSamples() {
  if (!emu || !audioCtx) return;
  emu.audio_drain();
  const ptr = emu.audio_ptr();
  const len = emu.audio_len();
  if (len === 0) return;
  const samples = new Float32Array(wasm_memory().buffer, ptr, len);
  // Direct copy — AudioContext runs at 96kHz natively
  for (let i = 0; i < len; i += 2) {
    audioBuf[audioWritePos * 2] = samples[i];
    audioBuf[audioWritePos * 2 + 1] = samples[i + 1];
    audioWritePos = (audioWritePos + 1) % AUDIO_BUF_SIZE;
  }
}

// Webcam for Pocket Camera
const camVideo = document.getElementById('cam-video');
const camCanvas = document.getElementById('cam-canvas');
const camCtx = camCanvas.getContext('2d', { willReadFrequently: true });
let cameraActive = false;
const camGrayscale = new Uint8Array(128 * 112);

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 128 }, height: { ideal: 112 }, facingMode: 'user' }
    });
    camVideo.srcObject = stream;
    cameraActive = true;
    console.log('Webcam active for Pocket Camera');
  } catch (e) {
    console.warn('Webcam unavailable:', e);
  }
}

function feedCameraFrame() {
  if (!cameraActive || !emu || camVideo.readyState < 2) return;
  // Draw video frame scaled to 128x112, mirrored horizontally
  camCtx.save();
  camCtx.translate(128, 0);
  camCtx.scale(-1, 1);
  camCtx.drawImage(camVideo, 0, 0, 128, 112);
  camCtx.restore();
  // Convert to grayscale
  const rgba = camCtx.getImageData(0, 0, 128, 112).data;
  for (let i = 0; i < 128 * 112; i++) {
    const r = rgba[i * 4], g = rgba[i * 4 + 1], b = rgba[i * 4 + 2];
    camGrayscale[i] = (r * 77 + g * 150 + b * 29) >> 8;
  }
  emu.set_camera_image(camGrayscale);
}

async function startEmulator(romBytes) {
  emu = new WasmEmulator(new Uint8Array(romBytes));
  const w = emu.width();
  const h = emu.height();

  // Init audio (requires user gesture — file pick/drop counts)
  initAudio();

  // Try WebGPU
  if (navigator.gpu) {
    try {
      canvas.width = w * 4;
      canvas.height = h * 4;
      await emu.init_gpu(canvas);
      useGpu = true;
      status.textContent = 'Rendering: WebGPU vectorize';
      // Also prepare 2D canvas for NN toggle
      canvas2d.width = w;
      canvas2d.height = h;
      ctx = canvas2d.getContext('2d');
    } catch (e) {
      console.warn('WebGPU init failed, falling back to Canvas2D:', e);
      useGpu = false;
    }
  }

  if (!useGpu) {
    canvas.width = w;
    canvas.height = h;
    ctx = canvas.getContext('2d');
    status.textContent = 'Rendering: Canvas2D';
  }

  // Load save from localStorage if available
  if (emu.has_battery()) {
    const key = emu.save_key();
    const saved = localStorage.getItem(key);
    if (saved) {
      const bytes = Uint8Array.from(atob(saved), c => c.charCodeAt(0));
      emu.load_save(bytes);
      console.log('Loaded save from localStorage:', key);
    }
  }

  // Attach printer and start webcam if needed
  emu.attach_printer();
  if (emu.has_camera()) initCamera();

  dropZone.classList.add('hidden');
  if (useGpu) toggleBtn.style.display = '';
  requestAnimationFrame(frame);
}

let filterMode = 'vectorize'; // 'vectorize' or 'nearest'
toggleBtn.addEventListener('click', () => {
  if (!emu) return;
  if (filterMode === 'vectorize') {
    filterMode = 'nearest';
    toggleBtn.textContent = 'Switch to Vectorize';
    status.textContent = 'Rendering: Nearest neighbor';
    canvas.style.display = 'none';
    canvas2d.style.display = '';
  } else {
    filterMode = 'vectorize';
    toggleBtn.textContent = 'Switch to Nearest';
    status.textContent = 'Rendering: WebGPU vectorize';
    canvas.style.display = '';
    canvas2d.style.display = 'none';
  }
});

let saveCounter = 0;
const GB_FRAME_MS = 1000.0 / 59.7275; // ~16.74ms per Game Boy frame
let emuTime = 0;
let lastTimestamp = 0;

function frame(timestamp) {
  if (!emu) return;
  if (lastTimestamp === 0) lastTimestamp = timestamp;

  emuTime += timestamp - lastTimestamp;
  lastTimestamp = timestamp;

  // Cap catchup to avoid spiral of death (e.g. tab was backgrounded)
  if (emuTime > GB_FRAME_MS * 3) emuTime = GB_FRAME_MS * 3;

  // Step emulation at GB native rate, independent of display refresh
  let stepped = false;
  while (emuTime >= GB_FRAME_MS) {
    if (cameraActive) feedCameraFrame();
    emu.step_frame();
    if (audioCtx) pushAudioSamples();
    emuTime -= GB_FRAME_MS;
    stepped = true;
    checkForPrint();
    saveCounter++;
    if (saveCounter >= 60 && emu.has_battery()) {
      saveCounter = 0;
      const data = emu.save_data();
      let bin = '';
      for (let i = 0; i < data.length; i++) bin += String.fromCharCode(data[i]);
      localStorage.setItem(emu.save_key(), btoa(bin));
    }
  }

  // Resize GPU surface to match wrapper size, preserving 10:9 aspect ratio
  if (useGpu) {
    const wrapper = document.getElementById('canvas-wrapper');
    const cw = wrapper.clientWidth;
    const ch = wrapper.clientHeight;
    // Fit 10:9 aspect ratio within wrapper
    let tw, th;
    if (cw * 9 <= ch * 10) {
      tw = cw;
      th = Math.round(cw * 9 / 10);
    } else {
      th = ch;
      tw = Math.round(ch * 10 / 9);
    }
    if (tw > 0 && th > 0 && (canvas.width !== tw || canvas.height !== th)) {
      canvas.width = tw;
      canvas.height = th;
      emu.resize_gpu(tw, th);
    }
  }

  // Only render if we stepped at least one frame
  if (stepped) {
    if (useGpu && filterMode === 'vectorize') {
      emu.render_gpu();
    } else if (ctx) {
      emu.frame_buffer_update();
      const ptr = emu.frame_buffer_ptr();
      const len = emu.frame_buffer_len();
      const w = emu.width();
      const h = emu.height();
      const rgba = new Uint8ClampedArray(wasm_memory().buffer, ptr, len);
      const img = new ImageData(rgba, w, h);
      ctx.putImageData(img, 0, 0);
    }
  }
  requestAnimationFrame(frame);
}

// Input
document.addEventListener('keydown', e => {
  const btn = keyMap[e.code];
  if (btn !== undefined && emu) { emu.set_button(btn, true); e.preventDefault(); }
});
document.addEventListener('keyup', e => {
  const btn = keyMap[e.code];
  if (btn !== undefined && emu) { emu.set_button(btn, false); e.preventDefault(); }
});

// File loading
function loadFile(file) {
  const reader = new FileReader();
  reader.onload = () => startEmulator(reader.result);
  reader.readAsArrayBuffer(file);
}

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('hover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('hover');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});

// Built-in ROM selector (populated from roms/ directory if present)
const BUNDLED_ROMS = [
  'Drymouth.gb',
  'GB Lander.gb',
  'Horrible Demon 3.gb',
  'Hungry are the Dead.gbc',
  'Iron Hike.gb',
  'Jet Pak DX.gb',
  'Mainblow.gbc',
  'Marcbla 3D.gb',
  'Megamania.gb',
  'Moon Fighter.gbc',
  'Mr. Dig.gbc',
  'Poke Mission 97.gb',
  'Q-Bert.gbc',
  'Shutdown.gb',
  'Skoardy.gb',
  'Sokoban.gb',
  'Sqrxz.gb',
  'The Horrible Demon.gb',
  'They Came From Outer Space.gb',
  'Tic-Tac-Toe.gb',
  'Ultima III.gb',
  'Yars Revenge.gb',
];

const romSelect = document.getElementById('rom-select');
const romSelector = document.getElementById('rom-selector');

// Check which ROMs are actually available, populate dropdown
(async () => {
  const available = [];
  for (const name of BUNDLED_ROMS) {
    try {
      const resp = await fetch('roms/' + encodeURIComponent(name), { method: 'HEAD' });
      if (resp.ok) available.push(name);
    } catch (e) { /* not available */ }
  }
  if (available.length > 0) {
    for (const name of available) {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name.replace(/\.(gb|gbc)$/i, '');
      romSelect.appendChild(opt);
    }
    romSelector.style.display = '';
  }
})();

romSelect.addEventListener('change', async () => {
  const name = romSelect.value;
  if (!name) return;
  status.textContent = 'Loading ' + name + '...';
  try {
    const resp = await fetch('roms/' + encodeURIComponent(name));
    const buf = await resp.arrayBuffer();
    startEmulator(buf);
  } catch (e) {
    status.textContent = 'Failed to load ROM: ' + e.message;
  }
});
</script>
</body>
</html>
